[project]
name = "django-blog"
version = "0.1.0"
description = "week 6 django blog exercise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2.26",
    "django-ckeditor>=6.7.3",
    "django-cleanup>=9.0.0",
    "django-etc>=1.4.0",
    "django-hitcount>=1.3.5",
    "pillow>=12.3.0",
    "sqlparse>=0.6.0",
    "beautifulsoup4>=4.14.2",
    "cssutils>=2.15.0",
    "pynliner>=0.8.0",
    "pytz>=2026.1",
]

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 69

[tool.ruff.lint]
select = [
    # pep8 naming
    "N",
    # isort
    "I",
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # pydocstyle
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8 annotations
    "ANN",
    # flake8 commas
    "COM818",
    # flake8-future-annotations
    "FA",
    # flake8-print
    "T20",
    # flake8-self
    "SLF",
    # flake8-raise
    "RSE",
    # flake8-pyi
    "PYI",
    # flake8-no-pep420
    "INP",
    # flake8-import-conventions
    "ICN",
    # flake8-implicit-str-concat
    "ISC002",
    "ISC003",
    # flake8-builtins
    "A",
    # flake8-boolean-trap
    "FBT",
    # flake8-blind-except
    "BLE",
]

ignore = ["ANN101"]
pyupgrade.keep-runtime-typing = true

[tool.ruff.lint.pycodestyle]
max-line-length = 79

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 79
preview = true

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = ["S101"]
